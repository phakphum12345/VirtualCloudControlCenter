name: Flutter CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# ยกเลิก Workflow เก่าที่ทำงานอยู่หากมีการ Push Commits ใหม่เข้ามาทับ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: ตรวจสอบความถูกต้องของโค้ด (Format, Analyze, Unit Tests)
  # -------------------------------------------------------------
  static-analysis-and-test:
    name: Code Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project code
        run: flutter analyze

      - name: Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

      - name: Upload coverage reports to Codecov (Optional)
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # -------------------------------------------------------------
  # Job 2: ทดสอบการ Compile Cross-Platform (Multi-OS Matrix)
  # -------------------------------------------------------------
  build-verification:
    name: Build Verification on ${{ matrix.os }}
    needs: static-analysis-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build-cmd: flutter build linux --debug
          - os: macos-latest
            platform: macos
            build-cmd: flutter build macos --debug
          - os: windows-latest
            platform: windows
            build-cmd: flutter build windows --debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ติดตั้ง Dependencies สำหรับ Linux Build
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop Support
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Desktop Application (${{ matrix.platform }})
        run: ${{ matrix.build-cmd }}
