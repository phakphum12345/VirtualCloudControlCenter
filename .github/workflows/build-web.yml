name: Build Flutter Web

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-web.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Analyze, test, and build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Windows icon source exists
        run: test -f windows/runner/resources/app_icon.ico

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: phakphum-ai-system-assistant-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
