# -------------------------------------------------------------
  # Job 2: ทดสอบการ Compile Cross-Platform (Multi-OS Matrix)
  # -------------------------------------------------------------
  build-verification:
    name: Build Verification on ${{ matrix.os }}
    # ลบบรรทัด needs: static-analysis-and-test ออก
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build-cmd: flutter build linux --debug
          - os: macos-latest
            platform: macos
            build-cmd: flutter build macos --debug
          - os: windows-latest
            platform: windows
            build-cmd: flutter build windows --debug
